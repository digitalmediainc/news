<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viewer</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

#viewer{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

#viewer img{
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    object-fit:contain;
}

#error{
    display:none;
    color:#fff;
    font-family:Arial,sans-serif;
    text-align:center;
    padding:30px;
}
</style>
</head>

<body>

<div id="viewer"></div>
<div id="error"></div>

<script>

(function(){

    // ==============================
    // GET URL PARAMETERS
    // ==============================

    const params = new URLSearchParams(window.location.search);

    const encodedV = params.get("v");
    const contentID = params.get("id");

    if(!encodedV){
        showError("Missing v parameter.");
        return;
    }


    // ==============================
    // DECODE v
    // ==============================

    let decodedV;

    try{

        decodedV = decodeURIComponent(encodedV);

    }catch(e){

        showError("Invalid v parameter.");
        return;

    }


    console.log("Decoded v:");
    console.log(decodedV);


    // ==============================
    // FIND <include path="..."/>
    // ==============================

    const match = decodedV.match(
        /<include\s+path\s*=\s*["']([^"']+)["']\s*\/?>/i
    );


    if(!match){

        showError(
            'Could not find <include path="..."/>'
        );

        return;

    }


    // ==============================
    // GET IMAGE PATH
    // ==============================

    const imagePath = match[1];

    console.log("Image path:");
    console.log(imagePath);


    // ==============================
    // GITHUB PAGES BASE
    // ==============================

    const baseURL =
        "https://digitalmediainc.github.io/news/";


    // ==============================
    // CREATE FINAL IMAGE URL
    // ==============================

    let imageURL;


    if(/^https?:\/\//i.test(imagePath)){

        imageURL = imagePath;

    }else{

        const cleanPath =
            imagePath.replace(/^\/+/, "");

        imageURL =
            baseURL + cleanPath;

    }


    console.log("Final image URL:");
    console.log(imageURL);


    // ==============================
    // CREATE IMAGE
    // ==============================

    const img =
        document.createElement("img");

    img.src = imageURL;

    img.alt =
        contentID || "Viewer Image";


    // ==============================
    // IMAGE SUCCESS
    // ==============================

    img.onload = function(){

        document
            .getElementById("viewer")
            .appendChild(img);

    };


    // ==============================
    // IMAGE ERROR
    // ==============================

    img.onerror = function(){

        showError(
            "Image could not be loaded.<br><br>" +
            imageURL
        );

    };


    // ==============================
    // LOAD IMAGE
    // ==============================

    document
        .getElementById("viewer")
        .appendChild(img);


    // ==============================
    // ERROR FUNCTION
    // ==============================

    function showError(message){

        const box =
            document.getElementById("error");

        box.innerHTML = message;

        box.style.display = "block";

    }

})();

</script>

</body>
</html>
