<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>360 Viewer</title>

<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"
/>

<style>
html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

#panorama {
    width: 100%;
    height: 100vh;
}

#error {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 30px;
    z-index: 9999;
}
</style>
</head>

<body>

<div id="panorama"></div>
<div id="error"></div>

<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>

<script>
(function () {

    const params = new URLSearchParams(window.location.search);

    const encodedV = params.get("v");
    const contentID = params.get("id");

    if (!encodedV) {
        showError("Missing v parameter.");
        return;
    }

    // Decode v
    let decodedV;

    try {
        decodedV = decodeURIComponent(encodedV);
    } catch (error) {
        showError("Could not decode v parameter.");
        return;
    }

    console.log("Decoded v:");
    console.log(decodedV);

    /*
        Find:

        <include path="/360/scene1.jpg"/>
    */

    const match = decodedV.match(
        /<include\s+path\s*=\s*["']([^"']+)["']\s*\/?>/i
    );

    if (!match) {
        showError(
            'Could not find <include path="..."/> in v parameter.'
        );
        return;
    }

    // Extract path
    const imagePath = match[1];

    console.log("Image path:");
    console.log(imagePath);

    // GitHub Pages base
    const baseURL =
        "https://digitalmediainc.github.io/news/";

    let imageURL;

    // Absolute URL
    if (/^https?:\/\//i.test(imagePath)) {

        imageURL = imagePath;

    } else {

        // /360/scene1.jpg
        // ↓
        // 360/scene1.jpg

        const cleanPath =
            imagePath.replace(/^\/+/, "");

        imageURL =
            baseURL + cleanPath;
    }

    console.log("Final panorama URL:");
    console.log(imageURL);

    /*
        Start Pannellum
    */

    try {

        pannellum.viewer("panorama", {

            type: "equirectangular",

            panorama: imageURL,

            autoLoad: true,

            showControls: true,

            compass: false,

            hfov: 100,

            pitch: 0,

            yaw: 0,

            title: contentID || "360 Viewer"

        });

    } catch (error) {

        showError(
            "Could not initialize 360 viewer.<br><br>" +
            error.message
        );

    }

})();


function showError(message) {

    const errorBox =
        document.getElementById("error");

    errorBox.innerHTML = message;

    errorBox.style.display = "flex";

}
</script>

</body>
</html>
